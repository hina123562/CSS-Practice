<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors file</title>

    <style>
        *{
            margin: 0px;
            padding: 50px;
            box-sizing: border-box;
        }
        .red{
            background-color: rgb(255, 0, 0);
            height: 100px;
            width: 200px;
        }
        .green{
            background-color: rgb(0, 255, 0);
             height: 100px;
             width: 200px;
        }
        .blue{
            background-color: rgb(0, 0 , 255);
             height: 100px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h3 class="red">red color</h3>
    <h3 class="green">green color</h3>
    <h3 class="blue">blue color</h3>
</body>
</html>
