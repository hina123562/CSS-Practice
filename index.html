<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Lists for Mango Juice</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body>
   <h1>Mango Juice Recipe</h1>

   <h2>Ingredients</h2>

   <div>
      <ul>
         <li>3 Mangoes</li>
         <li>4 Glass Milk</li>
         <li>5 Ice Cubes</li>
         <li>3 Spoon Sugar</li>
      </ul>
   </div>

   <h2>Steps</h2>

   <div>
      <ol>
         <li>peal the mangoes</li>
         <li>cut them into pieces</li>
         <li>put them in a juicer</li>
         <li>add milk and sugar</li>
         <li>serve with ice</li>
      </ol>
   </div>
</body>

</html>
